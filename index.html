<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-dark text-white">
    <h1 class="text-white text-center">Weather App</h1>

    <div class="row">
        <div class="col-10">
            <input type="text" class="form-control" id="textBox">
        </div>
        <div class="col-2">
            <button class="btn btn-outline-success w-100" onclick="getData();">Search</button>
        </div>
    </div>

    <!-- current -->
     <div class="row" id="currentDetails">
        <!-- html data from js -->
     </div>

    <!-- Today's forecast -->
    <div class="row mt-4" id="todayForecast">
        <!-- forecast data from js -->
    </div>
    <div id="weatherContainer"></div>

    </div>

    <!-- axios script -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <!-- bootsstrap script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <!-- js script -->
    <script src="script.js"></script>
    <!-- fontawesome script -->
    <script src="https://kit.fontawesome.com/c9254895d1.js" crossorigin="anonymous"></script>
</body>
</html>
